name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nfretes-backend-transportadora
  ECS_CLUSTER: nfretes-staging
  ECS_SERVICE: transportadora
  TASK_FAMILY: nfretes-staging-transportadora
  CONTAINER_NAME: transportadora

jobs:
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:staging" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:staging"

  migrations:
    name: Verificar e rodar migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Roda "yarn migration:run-prod" (migrations compiladas em dist/) como task one-off no ECS, com a MESMA imagem
      # e as MESMAS envs/segredos do serviço — o banco não fica exposto à
      # internet para o CI. O TypeORM só aplica migrations pendentes
      # (idempotente); qualquer falha aborta o deploy.
      - name: Rodar migrations no ECS (one-off task)
        run: |
          NETWORK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_FAMILY" \
            --network-configuration "$NETWORK" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"yarn\",\"migration:run-prod\"]}]}" \
            --started-by "github-actions-migrations" \
            --query 'tasks[0].taskArn' --output text)

          echo "Task de migrations: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          TASK_ID=$(echo "$TASK_ARN" | awk -F/ '{print $NF}')
          echo "── Últimas linhas do log da task ──"
          aws logs get-log-events \
            --log-group-name "/ecs/nfretes-staging/transportadora" \
            --log-stream-name "transportadora/$CONTAINER_NAME/$TASK_ID" \
            --limit 60 --query 'events[].message' --output text || true

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migrations falharam (exit $EXIT_CODE) — deploy abortado."
            exit 1
          fi
          echo "Migrations OK."

  deploy:
    name: Deploy no ECS
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar serviço ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null
          echo "Aguardando o serviço estabilizar..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deploy concluído."
